<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bishop Remote Gateway | Goseame-Server-01</title>
    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: rgba(15, 23, 42, 0.7);
            --border-color: rgba(94, 234, 212, 0.2);
            --accent-emerald: #10b981;
            --text-primary: #f8fafc;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.05) 0px, transparent 50%);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--accent-emerald);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        p {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--border-color);
            padding: 12px;
            color: white;
            border-radius: 8px;
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: var(--accent-emerald);
        }
        button {
            background: var(--accent-emerald);
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        button:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>AUTHENTICATION</h1>
        <p>Goseame-Server-01 Residency</p>
        <div class="input-group">
            <input type="text" placeholder="Admin Email..." id="email">
            <input type="password" placeholder="Password..." id="password">
            <button onclick="handleLogin()">LOG IN</button>
        </div>
    </div>
    <script>
        function handleLogin() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            // High-fidelity simulation: In production, this would hit the decentralized API node
            if (email === 'admin@goseame.co.za' && pass === 'G0s3am3_WebUI_!2026') {
                alert('Access Granted. Neural link established.');
                window.location.reload();
            } else {
                alert('Authentication Failed: Invalid Operator Credentials.');
            }
        }
    </script>
</body>
</html>
